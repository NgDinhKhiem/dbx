name: Database Environments

on:
  push:
    branches: [main]
    paths:
      - 'deploy/database/**'
      - 'scripts/database-env.mjs'
      - 'scripts/database-env.test.mjs'
      - 'Makefile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'docs/content/docs/database-lab.mdx'
      - 'docs/content/docs/database-lab.cn.mdx'
      - '.github/workflows/database-environments.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/database/**'
      - 'scripts/database-env.mjs'
      - 'scripts/database-env.test.mjs'
      - 'Makefile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'docs/content/docs/database-lab.mdx'
      - 'docs/content/docs/database-lab.cn.mdx'
      - '.github/workflows/database-environments.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: read-only by default; jobs that write request it explicitly.
permissions:
  contents: read

jobs:
  database-environments:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.13.0

      - name: Validate database environment tooling
        run: |
          pnpm test:db-env
          make db-check
