name: Suggest Similar Issues

on:
  issues:
    types: [opened]

concurrency:
  group: similar-issues-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suggest:
    runs-on: ubuntu-latest
    if: ${{ !github.event.issue.pull_request }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Create DBX bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DBX_BOT_APP_ID }}
          private-key: ${{ secrets.DBX_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: dbx
          permission-issues: write

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.13.0

      - name: Suggest similar issues
        run: node .github/scripts/suggest-similar-issues.mjs
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
