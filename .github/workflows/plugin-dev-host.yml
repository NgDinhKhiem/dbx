name: Plugin development host
on:
  pull_request:
    paths:
      - '.gitattributes'
      - 'plugins/sdk/cli/**'
      - 'plugins/sdk/dev-host/**'
      - 'packages/plugin-cli/**'
      - 'scripts/verify-plugin-cli-package.mjs'
      - '.github/workflows/plugin-dev-host.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.22'
          cache: false
      - run: npm ci --prefix plugins/sdk/dev-host
      - run: npm run lint --prefix plugins/sdk/dev-host
      - run: npm run fmt:check --prefix plugins/sdk/dev-host
      - run: npm test --prefix plugins/sdk/dev-host
        timeout-minutes: 5
      - uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3
        with:
          tool: cargo-nextest@0.9.137
      - run: cargo nextest run --locked --manifest-path plugins/sdk/cli/Cargo.toml --no-fail-fast
      - run: cargo test --doc --locked --manifest-path plugins/sdk/cli/Cargo.toml
      - run: npm test --prefix packages/plugin-cli
      - run: node scripts/verify-plugin-cli-package.mjs
        env:
          DBX_PLUGIN_CLI_VERIFY_NATIVE: '1'
